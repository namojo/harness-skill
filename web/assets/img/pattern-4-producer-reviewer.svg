<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="prTitle prDesc">
  <title id="prTitle">Producer-Reviewer Pattern</title>
  <desc id="prDesc">producer와 reviewer가 양방향 루프를 돌고 통과 시 출력으로 빠지는 다이어그램</desc>

  <defs>
    <marker id="arrow-pur" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7"/>
    </marker>
    <style>
      .label    { font-family: "Pretendard", -apple-system, system-ui, sans-serif; fill: #1F2937; }
      .title    { font-size: 22px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #6B7280; font-weight: 500; }
      .node     { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .edge     { font-size: 11px; fill: #6B7280; text-anchor: middle; }
      .edgeAcc  { font-size: 12px; fill: #A855F7; font-weight: 600; text-anchor: middle; }
      .warn     { font-size: 13px; fill: #1F2937; }
      .warnH    { font-size: 12px; fill: #A855F7; font-weight: 700; letter-spacing: 0.06em; }
      .counter  { font-size: 12px; fill: #A855F7; font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#ffffff"/>

  <text class="label title" x="40" y="56">Producer-Reviewer</text>
  <text class="label subtitle" x="40" y="80">통과될 때까지 · 종료 조건 필수</text>
  <rect x="40" y="92" width="56" height="3" fill="#A855F7"/>

  <!-- input -->
  <rect x="40" y="220" width="100" height="60" rx="8" fill="#ffffff" stroke="#1F2937" stroke-width="1.5"/>
  <text class="label node" x="90" y="247">input</text>
  <text class="label edge" x="90" y="267">요청</text>

  <!-- producer -->
  <rect x="220" y="180" width="140" height="60" rx="8" fill="#ffffff" stroke="#1F2937" stroke-width="1.5"/>
  <text class="label node" x="290" y="207">producer</text>
  <text class="label edge" x="290" y="227">초안 / 수정안</text>

  <!-- reviewer -->
  <rect x="440" y="260" width="140" height="60" rx="8" fill="#ffffff" stroke="#1F2937" stroke-width="1.5"/>
  <text class="label node" x="510" y="287">reviewer</text>
  <text class="label edge" x="510" y="307">검토 · 피드백</text>

  <!-- output -->
  <rect x="650" y="220" width="110" height="60" rx="8" fill="#ffffff" stroke="#A855F7" stroke-width="2"/>
  <text class="label node" x="705" y="247">output</text>
  <text class="label edge" x="705" y="267">pass</text>

  <!-- input -> producer -->
  <line x1="142" y1="240" x2="218" y2="220" stroke="#A855F7" stroke-width="1.8" marker-end="url(#arrow-pur)"/>

  <!-- producer -> reviewer (draft) -->
  <path d="M 340 240 C 400 240 410 270 440 280" fill="none" stroke="#A855F7" stroke-width="1.8" marker-end="url(#arrow-pur)"/>
  <text class="label edgeAcc" x="395" y="248">draft →</text>

  <!-- reviewer -> producer (revise loop) -->
  <path d="M 440 290 C 410 305 400 240 340 230" fill="none" stroke="#A855F7" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#arrow-pur)"/>
  <text class="label edgeAcc" x="395" y="290">← revise</text>

  <!-- max counter -->
  <rect x="285" y="330" width="240" height="40" rx="20" fill="#ffffff" stroke="#A855F7" stroke-width="1.5"/>
  <text class="label counter" x="305" y="356">loop counter · max = 3</text>
  <circle cx="495" cy="350" r="5" fill="#A855F7"/>
  <circle cx="480" cy="350" r="5" fill="#A855F7" opacity="0.55"/>
  <circle cx="465" cy="350" r="5" fill="#A855F7" opacity="0.25"/>

  <!-- reviewer -> output (pass) -->
  <path d="M 580 280 C 620 270 630 250 648 245" fill="none" stroke="#A855F7" stroke-width="2.2" marker-end="url(#arrow-pur)"/>
  <text class="label edgeAcc" x="618" y="270">approved →</text>

  <!-- loop region label -->
  <rect x="200" y="160" width="400" height="180" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" rx="6"/>
  <text class="label edge" x="400" y="152">review loop</text>

  <!-- warning box -->
  <rect x="50" y="400" width="700" height="60" rx="8" fill="#ffffff" stroke="#A855F7" stroke-width="1.5"/>
  <text class="label warnH" x="70" y="425">함정</text>
  <line x1="70" y1="433" x2="110" y2="433" stroke="#A855F7" stroke-width="2"/>
  <text class="label warn" x="70" y="450">종료 조건 없으면 무한 루프. — max 횟수, 점수 임계치, 시간 cap 중 하나는 반드시 둔다.</text>
</svg>
