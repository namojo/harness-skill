<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="supTitle supDesc">
  <title id="supTitle">Supervisor Pattern</title>
  <desc id="supDesc">supervisor가 워커들 위에서 실행 중 결정을 내리며 동적으로 흐름을 조정하는 다이어그램</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-gray-s" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <style>
      .label    { font-family: "Pretendard", -apple-system, system-ui, sans-serif; fill: #1F2937; }
      .title    { font-size: 22px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #6B7280; font-weight: 500; }
      .node     { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .edge     { font-size: 11px; fill: #6B7280; text-anchor: middle; }
      .edgeAcc  { font-size: 12px; fill: #EF4444; font-weight: 600; text-anchor: middle; }
      .warn     { font-size: 13px; fill: #1F2937; }
      .warnH    { font-size: 12px; fill: #EF4444; font-weight: 700; letter-spacing: 0.06em; }
      .step     { font-size: 10px; fill: #EF4444; font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#ffffff"/>

  <text class="label title" x="40" y="56">Supervisor</text>
  <text class="label subtitle" x="40" y="80">다음 단계가 앞 결과에 따라 달라진다</text>
  <rect x="40" y="92" width="56" height="3" fill="#EF4444"/>

  <!-- supervisor (top) -->
  <rect x="320" y="130" width="160" height="60" rx="8" fill="#ffffff" stroke="#EF4444" stroke-width="2"/>
  <text class="label node" x="400" y="157">supervisor</text>
  <text class="label edge" x="400" y="177">실행 중 결정</text>

  <!-- workers (bottom) -->
  <g>
    <rect x="120" y="290" width="140" height="60" rx="8" fill="#ffffff" stroke="#EF4444" stroke-width="2"/>
    <text class="label node" x="190" y="317">tech</text>
    <text class="label edge" x="190" y="337">기술 진단</text>
  </g>
  <g>
    <rect x="330" y="290" width="140" height="60" rx="8" fill="#ffffff" stroke="#EF4444" stroke-width="2"/>
    <text class="label node" x="400" y="317">refund</text>
    <text class="label edge" x="400" y="337">환불 처리</text>
  </g>
  <g>
    <rect x="540" y="290" width="140" height="60" rx="8" fill="#ffffff" stroke="#1F2937" stroke-width="1.5" opacity="0.5"/>
    <text class="label node" x="610" y="317">account</text>
    <text class="label edge" x="610" y="337">계정 관리</text>
  </g>

  <!-- dashed arrows: supervisor -> workers -->
  <path d="M 360 192 L 200 288" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <path d="M 400 192 L 400 288" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <path d="M 440 192 L 605 288" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" marker-end="url(#arrow-gray-s)"/>

  <!-- "실행 중 결정" central label -->
  <rect x="320" y="220" width="160" height="22" rx="11" fill="#ffffff" stroke="#EF4444" stroke-width="1"/>
  <text class="label edgeAcc" x="400" y="236">실행 중 결정 · dispatch</text>

  <!-- step badges -->
  <text class="label step" x="155" y="280">① tech 먼저</text>
  <text class="label step" x="362" y="280">② 결과 보고 refund</text>

  <!-- worker -> supervisor (return) arrows -->
  <path d="M 200 290 C 250 240 330 200 360 192" fill="none" stroke="#EF4444" stroke-width="1.2"
        opacity="0.6" stroke-dasharray="2 3"/>
  <path d="M 400 290 C 400 250 400 220 400 192" fill="none" stroke="#EF4444" stroke-width="1.2"
        opacity="0.6" stroke-dasharray="2 3"/>

  <!-- dynamic case highlight: tech -> refund -->
  <path d="M 260 320 L 328 320" fill="none" stroke="#EF4444" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text class="label edgeAcc" x="294" y="312">결과 기반 라우팅</text>

  <!-- Pipeline 비교 박스 -->
  <rect x="50" y="390" width="700" height="80" rx="8" fill="#ffffff" stroke="#EF4444" stroke-width="1.5"/>
  <text class="label warnH" x="70" y="416">Pipeline과의 차이</text>
  <line x1="70" y1="424" x2="200" y2="424" stroke="#EF4444" stroke-width="2"/>
  <text class="label warn" x="70" y="446">Pipeline은 컨베이어 벨트 — 다음 단계가 고정.</text>
  <text class="label warn" x="70" y="464">Supervisor는 매니저 — 앞 결과를 보고 다음 워커를 결정.</text>
</svg>
